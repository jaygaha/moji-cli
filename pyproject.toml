[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moji-cli"
version = "0.1.0"
description = "Fast Japanese ASR transcription & bilingual subtitle generation with Apple MLX Whisper and Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "jaygaha" }
]
keywords = [
    "whisper",
    "mlx-whisper",
    "apple-silicon",
    "transcription",
    "speech-to-text",
    "japanese",
    "translation",
    "ollama",
    "translategemma",
    "subtitles",
    "srt",
    "vtt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-whisper>=0.4.3",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "fugashi>=1.5.0",
    "jiwer>=4.0.0",
    "sacrebleu>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/jaygaha/moji-cli"
Repository = "https://github.com/jaygaha/moji-cli.git"
Issues = "https://github.com/jaygaha/moji-cli/issues"

[project.scripts]
moji = "moji.main:main"
moji-cli = "moji.main:main"

[tool.setuptools.packages.find]
where = ["src"]
